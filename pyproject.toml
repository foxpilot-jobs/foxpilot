[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "foxpilot"
version = "0.1.0"
description = "Local-first job discovery and career decision support"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "openai",
  "python-dotenv",
  "pypdf",
  "playwright",
  "httpx",
  "google-auth[requests]",
  "python-multipart",
  "pwdlib[argon2]",
  "sqlalchemy",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]
api = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary]",
  "alembic",
]

[project.scripts]
foxpilot = "career_agent.cli:main"
# Compatibility entry point for existing local installations.
career-agent = "career_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff.lint]
extend-ignore = ["B008"]
