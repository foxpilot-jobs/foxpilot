services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foxpilot
      POSTGRES_USER: foxpilot
      POSTGRES_PASSWORD: foxpilot-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foxpilot -d foxpilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    profiles: ["container-llm"]
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://foxpilot:foxpilot-dev-only@postgres:5432/foxpilot
      LLM_PROVIDER: ollama
      LLM_MODEL: llama3.1:8b
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      CAREER_AGENT_ALLOWED_ORIGINS: http://localhost:8080
      FOXPILOT_ENV: ${FOXPILOT_ENV:-local}
      FOXPILOT_AUTH_MODE: ${FOXPILOT_AUTH_MODE:-local}
      FOXPILOT_API_TOKEN: ${FOXPILOT_API_TOKEN:-}
      FOXPILOT_TOKEN_USER_ID: ${FOXPILOT_TOKEN_USER_ID:-staging-user}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  ollama_data:
